name: tests

on:
  push:
  pull_request:

jobs:
  kasweb:
    name: kasweb (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:test needs 18 or newer. 22 is what the SEA build targets.
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite is fully offline: it mocks both the KNS indexer and the
      # IPFS gateways, so it never touches the network.
      - run: npm test
        working-directory: kasweb

  webclient:
    name: webclient
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check webclient/app.js
      # The gateway probe race, driven in a vm with a stubbed DOM and a
      # virtual clock. No dependencies, no network.
      - run: node --test webclient/probe_test.js
      # The published build must match the source it is generated from.
      - run: node tools/build-dist-webclient.js
      - run: git diff --exit-code dist-webclient
