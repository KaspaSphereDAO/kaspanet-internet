<!--
  BUILD NOTE: single-file build of the Kaspanet web client, generated by
  tools/build-dist-webclient.js from webclient/index.html and
  webclient/app.js. Do not edit this file; edit those and rebuild with

      node tools/build-dist-webclient.js

  app.js is inlined below so this file works when pinned on its own as a
  raw single-file CID, which has no directory structure and so cannot
  resolve a separate "./app.js". opensearch.xml sits beside it for a
  folder upload; in a single-file pin the search link is simply inert.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaspanet Browser</title>
<link rel="search" type="application/opensearchdescription+xml" title="Kaspanet" href="./opensearch.xml">
<style>
  :root { --bg:#0b0e14; --panel:#11151d; --border:#222a38; --text:#d7dce2; --dim:#8b93a1; --accent:#49EACB; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100vh; display:flex; flex-direction:column }
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--border) }
  header b { white-space:nowrap; font-size:15px } header b span { color:var(--accent) }
  #addr { flex:1; background:#151a23; border:1px solid #2a3140; color:var(--text); padding:10px 14px; border-radius:8px; font-size:15px; min-width:0 }
  button { background:var(--accent); border:0; color:#06281f; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer; font-size:14px }
  #view { flex:1; position:relative }
  #frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; display:none }
  #panel { position:absolute; inset:0; overflow:auto; padding:26px 20px }
  .inner { max-width:760px; margin:0 auto }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; margin:14px 0 }
  .warn { border-color:#8a6d1a } .err { border-color:#7a2733 }
  .dim { color:var(--dim); font-size:14px } a { color:var(--accent) }
  code { background:#151a23; padding:2px 6px; border-radius:4px; word-break:break-all }
  .dot { font-size:11px } .ok{color:var(--accent)} .bad{color:#e05561} .mid{color:#d7a021}
  h1 { font-weight:600 }
  #mirrorBar { position:absolute; bottom:12px; right:12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:12px; align-items:center; gap:6px; z-index:5; display:none; box-shadow:0 4px 14px rgba(0,0,0,.35) }
</style>
</head>
<body>
<header>
  <b id="brand" style="cursor:pointer">Kaspa<span>net</span></b>
  <input id="addr" placeholder="name.kas, example.com, or ipfs://CID" autocomplete="off" spellcheck="false">
  <button id="goBtn">Visit</button>
</header>
<div id="view">
  <iframe id="frame" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer"></iframe>
  <div id="panel"><div class="inner" id="content"></div></div>
  <div id="mirrorBar">
    <span class="dim" id="mirrorInfo">Site stuck loading?</span> <a href="#" id="mirrorRetry">Try another mirror</a>
  </div>
</div>

<script>
"use strict";
/*
 * Kaspanet Browser — a zero-install decentralized web client for .kas domains.
 * Copyright (C) 2026 KaspaSphere DAO
 *
 * This program is free software: you can redistribute it and/or modify it
 * under the terms of the GNU Affero General Public License as published by
 * the Free Software Foundation, either version 3 of the License, or (at your
 * option) any later version.
 *
 * This program is distributed in the hope that it will be useful, but WITHOUT
 * ANY WARRANTY; without even the implied warranty of MERCHANTABILITY or
 * FITNESS FOR A PARTICULAR PURPOSE. See the GNU Affero General Public License
 * for more details. You should have received a copy of the GNU Affero General
 * Public License along with this program. If not, see
 * <https://www.gnu.org/licenses/>.
 *
 * Source code (AGPL §13): https://github.com/KaspaSphereDAO/kaspanet-internet
 *
 * Same protocol as kaspanet.exe: KNS naming on Kaspa -> ipfs:// pointer ->
 * content from IPFS gateways. Runs entirely client-side (KNS API is CORS-open).
 * Sites render in a sandboxed iframe on a *subdomain* gateway so every site
 * gets its own browser origin (real same-origin isolation; sandbox has no
 * allow-same-origin so the framed origin is opaque).
 */

const KNS_API    = "https://api.knsdomains.org/mainnet";

// IPFS gateway list. Each entry is a host plus the URL style that host
// actually serves:
//   subdomain -> https://<cid>.ipfs.<host>/   one browser origin per CID
//   path      -> https://<host>/ipfs/<cid>/   all sites share one origin
// Subdomain style is preferred. It gives every site its own origin, and it
// avoids the "X-Frame-Options: sameorigin" that several gateways send on
// path-style URLs, which Chrome then refuses to render inside our iframe.
// A path-style host is listed only after checking it sends no
// X-Frame-Options and no CSP frame-ancestors, so it still frames.
//
// NOTE (Sep 22 2026): re-verified host by host with curl against a live
// .kas site, checking status, content type, every Location header in the
// chain, framing headers and a non-HTML subresource. Removed:
//   w3s.link, nftstorage.link: 301/302 straight to dweb.link. Both are
//     delisted upstream as well (ipfs/public-gateway-checker bd0fa45c22
//     "remove w3s.link (redirects to dweb.link)", 2026-06-12, and
//     14b730f487 "remove nftstorage.link", 2025-12-18). storacha.link,
//     the w3s.link successor, redirects to dweb.link too.
//   dweb.link, ipfs.io: redirect browser traffic to the inbrowser.link
//     service-worker gateway. Service workers cannot register inside our
//     sandboxed iframe, which is exactly what keeps a random .kas site off
//     this page's origin, so the site never renders.
//     https://discuss.ipfs.tech/t/changes-to-ipfs-io-and-dweb-link-gateways/20328
//   trustless-gateway.link: serves raw/CAR responses only and answers an
//     HTML request with 406. It has no wildcard subdomain DNS either.
// Kept, in the order tried (Sep 23 2026: filebase first, because
// ipfs.hypha.coop returns zero bytes for our CIDs, which cost a full probe
// timeout on every load while it sat at the front of this list):
//   ipfs.filebase.io: 200 text/html, no redirects, no framing headers,
//     Access-Control-Allow-Origin *, subresources fine, well under a second
//     warm. Path style only, since no TLS certificate covers
//     <cid>.ipfs.ipfs.filebase.io. It sends a CSP with no script-src, so a
//     framed site's own scripts may be blocked, which is what the mirror bar
//     warns about.
//   ipfs.hypha.coop: subdomain style and no such CSP, so it does not block a
//     site's scripts, but it currently cannot retrieve our content at all.
// Re-verify with curl before reordering. Ordering this list from gateway
// registry docs alone has broken resolution here before.
const GATEWAYS   = [
  { host: "ipfs.filebase.io", style: "path",
    note: "this mirror may block the site's scripts" },
  { host: "ipfs.hypha.coop",  style: "subdomain" },
];
let   gwIndex    = 0;
const GATEWAY    = () => GATEWAYS[gwIndex % GATEWAYS.length];

const HOME_KAS   = "webclient.kas";
const CANONICAL  = "https://kaspanet.online";
const SOURCE_URL = "https://github.com/KaspaSphereDAO/kaspanet";
const BLOCKED_DOMAINS = new Set([]);
const BLOCKED_CIDS = new Set([]);

const CID_RE = /^(Qm[1-9A-HJ-NP-Za-km-z]{44,}|ba[a-z2-7]{20,})$/;
// Subset of CID_RE that's also safe to use as a DNS label: CIDv1, lowercase
// base32 only (Qm... CIDv0 is mixed-case base58 and can't survive as a
// hostname component — DNS is case-insensitive/normalizes case).
const CIDV1_RE = /^ba[a-z2-7]{20,}$/;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const resolveCache = new Map(); // domain -> {at, entry}

// Running inside kaspanet.exe? Delegate navigation to the local proxy
// (it enforces RAM-only + sealed-mode CSP, which a plain page cannot).
// The desktop client marks the page it serves with this meta tag (see
// markEmbedded() in kasweb/kaspanet.js). Sniffing the hostname instead does
// not work: the proxy runs on 127.0.0.1, but so does any ordinary static
// server, so serving this client locally for development used to send every
// navigation to /go?d=..., a route only the proxy answers.
const EMBEDDED = !!document.querySelector('meta[name="kaspanet-embedded"]');

// Whatever's currently loaded in the iframe, so "try another mirror" can
// reload the same site through the next gateway in the list.
let currentSite = null; // {kind, cid, base}

function parsePointer(s) {
  if (!s || typeof s !== "string") return null;
  s = s.trim(); let m;
  if ((m = s.match(/^ipfs:\/\/([^/?#]+)(\/[^?#]*)?/i))) return CID_RE.test(m[1]) ? { kind:"ipfs", cid:m[1], base:m[2]||"" } : null;
  if ((m = s.match(/^ipns:\/\/([^/?#]+)(\/[^?#]*)?/i))) return { kind:"ipns", cid:m[1], base:m[2]||"" };
  if ((m = s.match(/^(?:https?:\/\/[^/]+)?\/(ipfs|ipns)\/([^/?#]+)(\/[^?#]*)?/i))) return { kind:m[1].toLowerCase(), cid:m[2], base:m[3]||"" };
  if (CID_RE.test(s)) return { kind:"ipfs", cid:s, base:"" };
  return null;
}

// Build the URL used to load a site into the iframe, honouring the style
// the given gateway actually serves (see GATEWAYS above). A "subdomain"
// gateway still falls back to path style for CIDv0, which cannot be a DNS
// label; such a site may then be blocked from framing by X-Frame-Options.
function gatewayUrl(kind, cid, base, gw) {
  gw = gw || GATEWAY();
  if (gw.style === "subdomain" && CIDV1_RE.test(cid)) return `https://${cid}.${kind}.${gw.host}${base}/`;
  return `https://${gw.host}/${kind}/${cid}${base}/`;
}

async function jfetch(url) {
  const r = await fetch(url, { signal: AbortSignal.timeout(15000) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function resolveKas(domain) {
  domain = domain.toLowerCase();
  if (BLOCKED_DOMAINS.has(domain)) throw new Error("domain is blocklisted");
  const c = resolveCache.get(domain);
  if (c && Date.now() - c.at < 300000) return c.entry;
  const owner = await jfetch(`${KNS_API}/api/v1/${encodeURIComponent(domain)}/owner`);
  if (!owner?.success || !owner?.data?.assetId) throw new Error("domain not registered on KNS");
  const prof = await jfetch(`${KNS_API}/api/v1/domain/${encodeURIComponent(owner.data.assetId)}/profile`);
  const p = prof?.data?.profile || {};
  const ptr = parsePointer(p.website) || parsePointer(p.redirectUrl);
  let entry;
  if (ptr) {
    if (BLOCKED_CIDS.has(ptr.cid)) throw new Error("content is blocklisted");
    entry = { ptr, owner: owner.data.owner };
  } else {
    entry = { card: p, owner: owner.data.owner };
  }
  resolveCache.set(domain, { at: Date.now(), entry });
  return entry;
}

/* ---------------- UI ---------------- */

function showPanel(html) {
  currentSite = null;
  $("frame").style.display = "none";
  $("mirrorBar").style.display = "none";
  $("panel").style.display = "block";
  $("content").innerHTML = html;
}
function showFrame(url) {
  $("panel").style.display = "none";
  const f = $("frame");
  f.style.display = "block";
  f.src = url;
  $("mirrorBar").style.display = "flex";
}

// Mirror bar text: which gateway is actually serving, plus any warning that
// gateway carries (filebase's CSP can block a framed site's own scripts).
function setMirrorBar(text) {
  $("mirrorInfo").textContent = text;
  $("mirrorBar").style.display = "flex";
}

const PROBE_MS = 8000;

// Ask a gateway for the page before pointing the iframe at it, so a gateway
// that redirects (to a service-worker gateway, say), stalls, or answers 404
// never reaches the frame. redirect:"manual" turns a redirect into an
// observable opaqueredirect response instead of following it silently.
// A cross-origin fetch the gateway does not CORS-allow rejects with the same
// TypeError as a real network failure, and that tells us nothing about
// whether the iframe would load, since the iframe is not bound by CORS. Those
// come back "unknown" and are used only when nothing probes clean.
async function probeGateway(url) {
  try {
    const r = await fetch(url, { redirect: "manual", signal: AbortSignal.timeout(PROBE_MS) });
    if (r.type === "opaqueredirect") return "bad";
    if (r.type === "opaque") return "unknown";
    if (r.status >= 300 && r.status < 400) return "bad";
    return r.status === 200 ? "ok" : "bad";
  } catch (e) {
    if (e.name === "TimeoutError" || e.name === "AbortError") return "bad";
    return "unknown";
  }
}

// Guards against a slow probe finishing after the user has navigated on.
let loadToken = 0;

// Load a .kas/IPFS site into the frame, remembering it so the mirror button
// can retry through the next gateway without re-resolving KNS. Gateways are
// probed in order from gwIndex and the first clean one serves.
async function openSite(kind, cid, base) {
  currentSite = { kind, cid, base };
  const token = ++loadToken;
  const n = GATEWAYS.length;
  let unknown = -1;
  setMirrorBar("Checking mirrors\u2026");
  for (let i = 0; i < n; i++) {
    const idx = (gwIndex + i) % n;
    const verdict = await probeGateway(gatewayUrl(kind, cid, base, GATEWAYS[idx]));
    if (token !== loadToken) return;
    if (verdict === "ok") return serveFrom(idx, "ok");
    if (verdict === "unknown" && unknown < 0) unknown = idx;
  }
  if (unknown >= 0) return serveFrom(unknown, "unknown");
  showPanel(`<div class="card err"><b>No mirror could serve this site</b>
    <p class="dim">Every IPFS gateway we know either failed, stalled or redirected.
    The content may not be reachable on the IPFS network right now.</p>
    <p><a href="#" data-home>&larr; home</a></p></div>`);
}

function serveFrom(idx, verdict) {
  gwIndex = idx;
  const gw = GATEWAYS[idx];
  const { kind, cid, base } = currentSite;
  showFrame(gatewayUrl(kind, cid, base, gw));
  const bits = ["Mirror: " + gw.host];
  if (verdict === "unknown") bits.push("unverified");
  if (gw.note) bits.push(gw.note);
  setMirrorBar(bits.join(" \u00b7 "));
}

function retryMirror() {
  if (!currentSite) return;
  gwIndex = (gwIndex + 1) % GATEWAYS.length;
  openSite(currentSite.kind, currentSite.cid, currentSite.base);
}

const OFFLINE_HTML = `<div class="card err"><b><span class="dot bad">&#9679;</span> Offline</b>
  <p class="dim">The KNS indexer can't be reached. Check your Wi-Fi / internet connection and try again.</p>
  <p><a href="#" data-home>&larr; retry</a></p></div>`;

function isNetErr(e) {
  return e.name === "TypeError" || e.name === "TimeoutError" || /Failed to fetch|NetworkError|timeout/i.test(e.message) || !navigator.onLine;
}

function knsCard(domain, p, owner) {
  const link = (u, l) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(l)}</a>`;
  const rows = [];
  if (p.bio) rows.push(esc(p.bio));
  if (p.x) rows.push("X: " + link("https://x.com/" + p.x, "@" + p.x));
  if (p.telegram) rows.push("Telegram: " + link("https://t.me/" + p.telegram, "@" + p.telegram));
  if (p.github) rows.push("GitHub: " + link("https://github.com/" + p.github, p.github));
  if (p.discord) rows.push("Discord: <code>" + esc(p.discord) + "</code>");
  if (p.contactEmail) rows.push("Email: <code>" + esc(p.contactEmail) + "</code>");
  const site = p.website || p.redirectUrl;
  if (site) rows.push("Website (legacy web): " + link(site, site));
  return `
  ${p.bannerUrl ? `<img src="${esc(p.bannerUrl)}" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px">` : ""}
  <div class="card">
    ${p.avatarUrl ? `<img src="${esc(p.avatarUrl)}" style="width:84px;height:84px;border-radius:50%;border:3px solid var(--accent);object-fit:cover">` : ""}
    <h1 style="margin:10px 0 4px">${esc(domain)}</h1>
    <p class="dim">Owner: <code>${esc(owner || "unknown")}</code></p>
    ${rows.map(r => `<p>${r}</p>`).join("")}
    <p class="dim">This domain is registered on KNS but hasn't published a decentralized site yet.
    The owner can set <b>Website</b> to <code>ipfs://&lt;CID&gt;</code> in their KNS profile to go live.</p>
  </div>`;
}

async function openKas(domain) {
  showPanel(`<div class="card"><span class="dim">Resolving <code>${esc(domain)}</code> on Kaspa&hellip;</span></div>`);
  try {
    const entry = await resolveKas(domain);
    if (entry.card) return showPanel(knsCard(domain, entry.card, entry.owner));
    const { kind, cid, base } = entry.ptr;
    openSite(kind, cid, base);
  } catch (e) {
    showPanel(isNetErr(e) ? OFFLINE_HTML
      : `<div class="card err"><b>${esc(domain)}</b> &mdash; ${esc(e.message)}<p><a href="#" data-home>&larr; home</a></p></div>`);
  }
}

function go(input) {
  const d = (input ?? $("addr").value).trim();
  if (!d) return;
  $("addr").value = d;
  if (EMBEDDED) { location.href = "/go?d=" + encodeURIComponent(d); return; }
  const ptr = parsePointer(d);
  if (ptr) return openSite(ptr.kind, ptr.cid, ptr.base);
  const bare = d.replace(/^kas:\/\//i, "").split(/[/?#]/)[0];
  if (/\.kas$/i.test(bare)) { location.hash = bare.toLowerCase(); return openKas(bare.toLowerCase()); }
  if (/^https?:\/\/\S+$/i.test(d)) return void window.open(d, "_blank", "noopener");
  if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(d)) return void window.open("https://" + d, "_blank", "noopener");
  showPanel(`<div class="card err"><b>Not a .kas name, web address, or IPFS pointer:</b> ${esc(d)}<p><a href="#" data-home>&larr; home</a></p></div>`);
}

async function goHome() {
  location.hash = "";
  showPanel(`<div class="card"><span class="dim">Checking network&hellip;</span></div>`);
  let badge;
  if (EMBEDDED) {
    // Inside kaspanet.exe the sealed CSP blocks direct KNS calls (by design).
    // Ask the local proxy's same-origin /status endpoint instead.
    try {
      const r = await (await fetch("/status", { signal: AbortSignal.timeout(10000) })).json();
      if (r.offline) return showPanel(OFFLINE_HTML);
      badge = r.live
        ? `<span class="dot ok">&#9679;</span> <code>${esc(r.webclient || HOME_KAS)}</code> pulling live from IPFS &mdash; you are on the hosted client inside kaspanet (${esc(r.mode)} mode)`
        : `<span class="dot mid">&#9679;</span> <code>${esc(r.webclient || HOME_KAS)}</code> not live: ${esc(r.detail)}`;
    } catch (e) {
      badge = `<span class="dot mid">&#9679;</span> local status unavailable`;
    }
    return renderHome(badge);
  }
  try {
    const entry = await resolveKas(HOME_KAS);
    if (entry.ptr) {
      // Subdomain gateways put the CID in the hostname, path ones in the path.
      const onIt = location.hostname.includes(entry.ptr.cid) || location.pathname.includes(entry.ptr.cid);
      badge = `<span class="dot ok">&#9679;</span> <code>${esc(HOME_KAS)}</code> pulling live from IPFS`
        + (onIt ? " &mdash; you are on the live decentralized copy" : ` &mdash; <a href="${gatewayUrl(entry.ptr.kind, entry.ptr.cid, "")}">open decentralized copy</a>`);
    } else {
      badge = `<span class="dot mid">&#9679;</span> <code>${esc(HOME_KAS)}</code> registered but no ipfs:// pointer yet`;
    }
  } catch (e) {
    if (isNetErr(e)) return showPanel(OFFLINE_HTML);
    badge = `<span class="dot mid">&#9679;</span> <code>${esc(HOME_KAS)}</code> not live: ${esc(e.message)}`;
  }
  renderHome(badge);
}

function renderHome(badge) {
  showPanel(`
  <h1>Kaspa<span style="color:var(--accent)">net</span> Browser</h1>
  <p class="dim">Zero-install client for the .kas decentralized web &mdash; KNS naming on Kaspa, content over IPFS. Runs entirely in your browser; no server, no account.</p>
  <div class="card"><span class="dim">${badge}</span></div>
  <div class="card"><b>Search from your address bar</b>
    <p class="dim">Chrome &rarr; Settings &rarr; Search engine &rarr; Manage &rarr; Add:<br>
    URL <code>${CANONICAL}/#%s</code>, shortcut <code>kas</code>.<br>
    Then type <code>kas&nbsp;yourname.kas</code> straight in the omnibox.</p></div>
  <div class="card"><b>Publish a site</b>
    <p class="dim">Upload a static folder to IPFS (relative links, index.html at root), copy the CID,
    and set <b>Website</b> to <code>ipfs://&lt;CID&gt;</code> in your KNS domain profile.</p></div>
  <p class="dim">Sites render in a sandboxed frame with per-site origins (subdomain gateway).
  For the RAM-only, sealed-mode experience, use the kaspanet desktop client.</p>
  <p class="dim">Kaspanet &copy; 2026 KaspaSphere DAO. This software comes with ABSOLUTELY NO WARRANTY.
  Free software under <a href="${SOURCE_URL}" target="_blank" rel="noopener noreferrer">AGPLv3</a>; you may
  redistribute it under those terms. <a href="${SOURCE_URL}" target="_blank" rel="noopener noreferrer">Source code</a>.</p>`);
}

addEventListener("DOMContentLoaded", () => {
  $("goBtn").addEventListener("click", () => go());
  $("brand").addEventListener("click", () => goHome());
  $("addr").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  $("mirrorRetry").addEventListener("click", e => { e.preventDefault(); retryMirror(); });
  // delegated handler for "home / retry" links rendered into the result panel
  $("content").addEventListener("click", e => {
    const a = e.target.closest("a[data-home]");
    if (a) { e.preventDefault(); goHome(); }
  });
  const q = new URLSearchParams(location.search).get("q") || decodeURIComponent(location.hash.slice(1));
  if (q) go(q); else goHome();
});
addEventListener("hashchange", () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && h !== $("addr").value) go(h);
});

</script>
</body>
</html>
